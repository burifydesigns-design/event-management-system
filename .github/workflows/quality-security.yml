name: Quality and dependency security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, audit, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      # Production dependencies gate the build. Dev-only findings (vite/esbuild dev server) are tracked via Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Run backend tests
        run: npm test --workspace backend -- --passWithNoTests
